name: deploy-book

on:
  push:
    branches:
      - main 
      - DEV_Package_Req_and_Install

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # Ensure Jupyter kernels are available if MyST executes notebooks in the future
          pip install ipykernel
      
      - name: Install CBC Solver
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-cbc

      - name: Run Pytest suite
        run: |
          pytest

      # 1. Setup Node.js (Required by MyST-CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Install the MyST compiler globally
      - name: Install MyST CLI
        run: npm install -g mystmd

      # 3. Build the book using MyST inside the docs folder
      - name: Build the book
        working-directory: docs
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      # 4. Upload the built static files
      # MyST creates its build folder inside the directory where myst.yml lives
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
